<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compare three truck routes against the forecast weather at each checkpoint's ETA, and pick the safest." />
    <title>Weather-Aware Truck Routing</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a light flash.
      try {
        const t = localStorage.getItem('wtr-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
